# Alembic owns the database schema. The URL is deliberately absent: it comes from
# DATABASE_URL at run time (see migrations/env.py), so there is one source of truth and no
# chance of a config file quietly pointing a migration at the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = .
# Explicit, or Alembic falls back to splitting on spaces/commas and warns.
path_separator = os
# Filenames sort chronologically and read as a history rather than a pile of hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
